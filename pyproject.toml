[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-monitor"
version = "1.0.0"
description = "Linux server monitoring agent with Discord alerting and a local dashboard"
requires-python = ">=3.9"
dependencies = [
    "psutil>=7.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "qbittorrent-api>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
server-monitor = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"core.web" = ["site/*", "site/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test*.py"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "RET", "PIE", "PLW", "UP"]
ignore = [
    "E501",    # long lines: f-string log messages are kept readable on one line
    "PLW0603", # module-level caches are intentionally rebound
    "SIM102",  # nested ifs keep separate branches readable
    "SIM105",  # try/except/pass is used deliberately around logging during disk-full incidents
]
